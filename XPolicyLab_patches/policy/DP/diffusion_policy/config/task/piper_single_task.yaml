name: piper_stack_red_green
image_shape:
- 3
- 240
- 320
shape_meta:
  obs:
    head_cam:
      shape:
      - 3
      - 240
      - 320
      type: rgb
    left_cam:
      shape:
      - 3
      - 240
      - 320
      type: rgb
    agent_pos:
      shape:
      - 7
      type: low_dim
  action:
    shape:
    - 7
env_runner:
  _target_: diffusion_policy.env_runner.pusht_image_runner.PushTImageRunner
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 50
  n_test_vis: 4
  legacy_test: true
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null
dataset:
  _target_: diffusion_policy.dataset.piper_image_dataset.PiperImageDataset
  zarr_path: null
  batch_size: ${dataloader.batch_size}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
